---
apiVersion: tekton.dev/v1
kind: Task
metadata:
  name: cleanup
spec:
  description: This task will clean up a workspace by deleting all of the files.
  steps:
  - computeResources: {}
    env:
    - name: WORKSPACE_SOURCE_PATH
      value: $(workspaces.source.path)
    image: alpine:3
    name: remove
    script: "#!/usr/bin/env sh\nset -eu\necho \"Removing all files from ${WORKSPACE_SOURCE_PATH}\
      \ ...\"\n# Delete any existing contents of the directory if it exists.\n#\n\
      # We don't just \"rm -rf ${WORKSPACE_SOURCE_PATH}\" because ${WORKSPACE_SOURCE_PATH}\
      \ might be \"/\"\n# or the root of a mounted volume.\nif [ -d \"${WORKSPACE_SOURCE_PATH}\"\
      \ ] ; then\n  # Delete non-hidden files and directories\n  rm -rf \"${WORKSPACE_SOURCE_PATH:?}\"\
      /*\n  # Delete files and directories starting with . but excluding ..\n  rm\
      \ -rf \"${WORKSPACE_SOURCE_PATH}\"/.[!.]*\n  # Delete files and directories\
      \ starting with .. plus any other character\n  rm -rf \"${WORKSPACE_SOURCE_PATH}\"\
      /..?*\nfi\n"
    securityContext:
      runAsNonRoot: false
      runAsUser: 0
    workingDir: $(workspaces.source.path)
  workspaces:
  - name: source
---
apiVersion: tekton.dev/v1
kind: Task
metadata:
  name: git-clone
spec:
  description: 'These Tasks are Git tasks to work with repositories used by other
    tasks in your Pipeline.

    The git-clone Task will clone a repo from the provided url into the output Workspace.
    By default the repo will be cloned into the root of your Workspace. You can clone
    into a subdirectory by setting this Task''s subdirectory param. This Task also
    supports sparse checkouts. To perform a sparse checkout, pass a list of comma
    separated directory patterns to this Task''s sparseCheckoutDirectories param.'
  params:
  - description: Repository URL to clone from.
    name: url
    type: string
  - default: ''
    description: Revision to checkout. (branch, tag, sha, ref, etc...)
    name: revision
    type: string
  - default: ''
    description: Refspec to fetch before checking out revision.
    name: refspec
    type: string
  - default: 'true'
    description: Initialize and fetch git submodules.
    name: submodules
    type: string
  - default: '1'
    description: Perform a shallow clone, fetching only the most recent N commits.
    name: depth
    type: string
  - default: 'true'
    description: Set the `http.sslVerify` global git config. Setting this to `false`
      is not advised unless you are sure that you trust your git remote.
    name: sslVerify
    type: string
  - default: ca-bundle.crt
    description: file name of mounted crt using ssl-ca-directory workspace. default
      value is ca-bundle.crt.
    name: crtFileName
    type: string
  - default: ''
    description: Subdirectory inside the `output` Workspace to clone the repo into.
    name: subdirectory
    type: string
  - default: ''
    description: Define the directory patterns to match or exclude when performing
      a sparse checkout.
    name: sparseCheckoutDirectories
    type: string
  - default: 'true'
    description: Clean out the contents of the destination directory if it already
      exists before cloning.
    name: deleteExisting
    type: string
  - default: ''
    description: HTTP proxy server for non-SSL requests.
    name: httpProxy
    type: string
  - default: ''
    description: HTTPS proxy server for SSL requests.
    name: httpsProxy
    type: string
  - default: ''
    description: Opt out of proxying HTTP/HTTPS requests.
    name: noProxy
    type: string
  - default: 'true'
    description: Log the commands that are executed during `git-clone`'s operation.
    name: verbose
    type: string
  - default: ghcr.io/tektoncd/github.com/tektoncd/pipeline/cmd/git-init:v0.40.2
    description: The image providing the git-init binary that this Task runs.
    name: gitInitImage
    type: string
  - default: /home/git
    description: 'Absolute path to the user''s home directory.

      '
    name: userHome
    type: string
  results:
  - description: The precise commit SHA that was fetched by this Task.
    name: commit
    type: string
  - description: The precise URL that was fetched by this Task.
    name: url
    type: string
  - description: The epoch timestamp of the commit that was fetched by this Task.
    name: committer-date
    type: string
  steps:
  - computeResources: {}
    env:
    - name: HOME
      value: $(params.userHome)
    - name: PARAM_URL
      value: $(params.url)
    - name: PARAM_REVISION
      value: $(params.revision)
    - name: PARAM_REFSPEC
      value: $(params.refspec)
    - name: PARAM_SUBMODULES
      value: $(params.submodules)
    - name: PARAM_DEPTH
      value: $(params.depth)
    - name: PARAM_SSL_VERIFY
      value: $(params.sslVerify)
    - name: PARAM_CRT_FILENAME
      value: $(params.crtFileName)
    - name: PARAM_SUBDIRECTORY
      value: $(params.subdirectory)
    - name: PARAM_DELETE_EXISTING
      value: $(params.deleteExisting)
    - name: PARAM_HTTP_PROXY
      value: $(params.httpProxy)
    - name: PARAM_HTTPS_PROXY
      value: $(params.httpsProxy)
    - name: PARAM_NO_PROXY
      value: $(params.noProxy)
    - name: PARAM_VERBOSE
      value: $(params.verbose)
    - name: PARAM_SPARSE_CHECKOUT_DIRECTORIES
      value: $(params.sparseCheckoutDirectories)
    - name: PARAM_USER_HOME
      value: $(params.userHome)
    - name: WORKSPACE_OUTPUT_PATH
      value: $(workspaces.output.path)
    - name: WORKSPACE_SSH_DIRECTORY_BOUND
      value: $(workspaces.ssh-directory.bound)
    - name: WORKSPACE_SSH_DIRECTORY_PATH
      value: $(workspaces.ssh-directory.path)
    - name: WORKSPACE_BASIC_AUTH_DIRECTORY_BOUND
      value: $(workspaces.basic-auth.bound)
    - name: WORKSPACE_BASIC_AUTH_DIRECTORY_PATH
      value: $(workspaces.basic-auth.path)
    - name: WORKSPACE_SSL_CA_DIRECTORY_BOUND
      value: $(workspaces.ssl-ca-directory.bound)
    - name: WORKSPACE_SSL_CA_DIRECTORY_PATH
      value: $(workspaces.ssl-ca-directory.path)
    image: $(params.gitInitImage)
    name: clone
    script: "#!/usr/bin/env sh\nset -eu\n\nif [ \"${PARAM_VERBOSE}\" = \"true\" ]\
      \ ; then\n  set -x\nfi\n\nif [ \"${WORKSPACE_BASIC_AUTH_DIRECTORY_BOUND}\" =\
      \ \"true\" ] ; then\n  cp \"${WORKSPACE_BASIC_AUTH_DIRECTORY_PATH}/.git-credentials\"\
      \ \"${PARAM_USER_HOME}/.git-credentials\"\n  cp \"${WORKSPACE_BASIC_AUTH_DIRECTORY_PATH}/.gitconfig\"\
      \ \"${PARAM_USER_HOME}/.gitconfig\"\n  chmod 400 \"${PARAM_USER_HOME}/.git-credentials\"\
      \n  chmod 400 \"${PARAM_USER_HOME}/.gitconfig\"\nfi\n\nif [ \"${WORKSPACE_SSH_DIRECTORY_BOUND}\"\
      \ = \"true\" ] ; then\n  cp -R \"${WORKSPACE_SSH_DIRECTORY_PATH}\" \"${PARAM_USER_HOME}\"\
      /.ssh\n  chmod 700 \"${PARAM_USER_HOME}\"/.ssh\n  chmod -R 400 \"${PARAM_USER_HOME}\"\
      /.ssh/*\nfi\n\nif [ \"${WORKSPACE_SSL_CA_DIRECTORY_BOUND}\" = \"true\" ] ; then\n\
      \   export GIT_SSL_CAPATH=\"${WORKSPACE_SSL_CA_DIRECTORY_PATH}\"\n   if [ \"\
      ${PARAM_CRT_FILENAME}\" != \"\" ] ; then\n      export GIT_SSL_CAINFO=\"${WORKSPACE_SSL_CA_DIRECTORY_PATH}/${PARAM_CRT_FILENAME}\"\
      \n   fi\nfi\nCHECKOUT_DIR=\"${WORKSPACE_OUTPUT_PATH}/${PARAM_SUBDIRECTORY}\"\
      \n\ncleandir() {\n  # Delete any existing contents of the repo directory if\
      \ it exists.\n  #\n  # We don't just \"rm -rf ${CHECKOUT_DIR}\" because ${CHECKOUT_DIR}\
      \ might be \"/\"\n  # or the root of a mounted volume.\n  if [ -d \"${CHECKOUT_DIR}\"\
      \ ] ; then\n    # Delete non-hidden files and directories\n    rm -rf \"${CHECKOUT_DIR:?}\"\
      /*\n    # Delete files and directories starting with . but excluding ..\n  \
      \  rm -rf \"${CHECKOUT_DIR}\"/.[!.]*\n    # Delete files and directories starting\
      \ with .. plus any other character\n    rm -rf \"${CHECKOUT_DIR}\"/..?*\n  fi\n\
      }\n\nif [ \"${PARAM_DELETE_EXISTING}\" = \"true\" ] ; then\n  cleandir || true\n\
      fi\n\ntest -z \"${PARAM_HTTP_PROXY}\" || export HTTP_PROXY=\"${PARAM_HTTP_PROXY}\"\
      \ntest -z \"${PARAM_HTTPS_PROXY}\" || export HTTPS_PROXY=\"${PARAM_HTTPS_PROXY}\"\
      \ntest -z \"${PARAM_NO_PROXY}\" || export NO_PROXY=\"${PARAM_NO_PROXY}\"\n\n\
      git config --global --add safe.directory \"${WORKSPACE_OUTPUT_PATH}\"\n/ko-app/git-init\
      \ \\\n  -url=\"${PARAM_URL}\" \\\n  -revision=\"${PARAM_REVISION}\" \\\n  -refspec=\"\
      ${PARAM_REFSPEC}\" \\\n  -path=\"${CHECKOUT_DIR}\" \\\n  -sslVerify=\"${PARAM_SSL_VERIFY}\"\
      \ \\\n  -submodules=\"${PARAM_SUBMODULES}\" \\\n  -depth=\"${PARAM_DEPTH}\"\
      \ \\\n  -sparseCheckoutDirectories=\"${PARAM_SPARSE_CHECKOUT_DIRECTORIES}\"\n\
      cd \"${CHECKOUT_DIR}\"\nRESULT_SHA=\"$(git rev-parse HEAD)\"\nEXIT_CODE=\"$?\"\
      \nif [ \"${EXIT_CODE}\" != 0 ] ; then\n  exit \"${EXIT_CODE}\"\nfi\nRESULT_COMMITTER_DATE=\"\
      $(git log -1 --pretty=%ct)\"\nprintf \"%s\" \"${RESULT_COMMITTER_DATE}\" > \"\
      $(results.committer-date.path)\"\nprintf \"%s\" \"${RESULT_SHA}\" > \"$(results.commit.path)\"\
      \nprintf \"%s\" \"${PARAM_URL}\" > \"$(results.url.path)\"\n"
    securityContext:
      runAsNonRoot: true
      runAsUser: 65532
  workspaces:
  - description: The git repo will be cloned onto the volume backing this Workspace.
    name: output
  - description: 'A .ssh directory with private key, known_hosts, config, etc. Copied
      to

      the user''s home before git commands are executed. Used to authenticate

      with the git remote when performing the clone. Binding a Secret to this

      Workspace is strongly recommended over other volume types.

      '
    name: ssh-directory
    optional: true
  - description: 'A Workspace containing a .gitconfig and .git-credentials file. These

      will be copied to the user''s home before any git commands are run. Any

      other files in this Workspace are ignored. It is strongly recommended

      to use ssh-directory over basic-auth whenever possible and to bind a

      Secret to this Workspace over other volume types.

      '
    name: basic-auth
    optional: true
  - description: 'A workspace containing CA certificates, this will be used by Git
      to

      verify the peer with when fetching or pushing over HTTPS.

      '
    name: ssl-ca-directory
    optional: true
---
apiVersion: tekton.dev/v1
kind: Task
metadata:
  name: flake8
spec:
  params:
  - default: python:3.9-slim
    name: image
    type: string
  - default: []
    name: args
    type: array
  steps:
  - args:
    - -c
    - 'python -m pip install --no-cache-dir flake8

      flake8 service "$@"

      '
    - --
    - $(params.args[*])
    command:
    - /bin/sh
    computeResources: {}
    image: $(params.image)
    name: lint
    workingDir: $(workspaces.source.path)
  workspaces:
  - name: source
---
apiVersion: tekton.dev/v1
kind: Task
metadata:
  name: nose
spec:
  params:
  - default: -v
    description: Arguments to pass to nose
    name: args
    type: string
  steps:
  - computeResources: {}
    image: python:3.9-slim
    name: nosetests
    script: '#!/bin/bash

      set -e


      echo "***** Environment *****"

      python --version

      pwd


      echo "***** Installing dependencies *****"

      python -m pip install --upgrade pip wheel

      pip install -r requirements.txt


      echo "***** Running nosetests with: $(params.args)"

      nosetests $(params.args)

      '
    workingDir: $(workspaces.source.path)
  workspaces:
  - name: source
